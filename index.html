<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Học Tập - Bài 14 KHTN 7</title>
    
    <!-- Import font Nunito hỗ trợ cực tốt tiếng Việt -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS cho việc tạo kiểu (Styling) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel để biên dịch JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body { font-family: 'Nunito', sans-serif; background-color: #fdfbf7; }
        
        /* Hiệu ứng tựa đề 3D màu cam */
        .title-3d {
            color: #f97316; /* orange-500 */
            text-shadow: 3px 3px 0px #ea580c, 6px 6px 0px #ffedd5, 8px 8px 15px rgba(0,0,0,0.15);
            letter-spacing: 1px;
        }
        
        /* Chỉnh kích thước chữ mặc định cho textarea/input to hơn */
        .text-lg-input { font-size: 1.25rem; line-height: 1.8rem; }
        
        @media print {
            .no-print { display: none !important; }
            body { background-color: white; }
            .print-bg { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
            textarea { resize: none; overflow: hidden; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const App = () => {
            const [formData, setFormData] = React.useState({});

            const handleChange = (e) => {
                const { name, value, type, checked } = e.target;
                setFormData(prev => ({
                    ...prev,
                    [name]: type === 'checkbox' ? checked : value
                }));
            };

            // Hàm tự động điền gợi ý khi bấm vào ô trống
            const handleSuggest = (name, suggestion) => {
                if (!formData[name]) {
                    setFormData(prev => ({
                        ...prev,
                        [name]: suggestion
                    }));
                }
            };

            const handlePrint = () => {
                window.print();
            };

            return (
                <div className="w-[96%] max-w-[1600px] mx-auto my-4 md:my-8 bg-white shadow-2xl rounded-2xl p-6 md:p-10 print-bg text-xl">
                    {/* Nút In phiếu */}
                    <div className="flex justify-end mb-4 no-print">
                        <button 
                            onClick={handlePrint}
                            className="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg shadow-sm transition duration-150 ease-in-out flex items-center gap-2"
                        >
                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
                            In / Lưu PDF
                        </button>
                    </div>

                    {/* HEADER */}
                    <div className="text-center mb-10 border-b-2 border-gray-200 pb-8">
                        <h2 className="text-xl font-bold text-gray-500 uppercase tracking-widest mb-3">Phiếu Học Tập – Khoa Học Tự Nhiên 7</h2>
                        <h1 className="text-4xl md:text-5xl lg:text-6xl font-black mb-8 title-3d uppercase">BÀI 14. PHẢN XẠ ÂM, CHỐNG Ô NHIỄM TIẾNG ỒN</h1>
                        
                        <div className="flex flex-wrap justify-between gap-6 text-left text-xl">
                            <div className="flex-1 min-w-[250px]">
                                <label className="font-bold text-gray-700 block mb-2">Họ và tên:</label>
                                <input type="text" className="w-full border-b-2 border-gray-300 focus:border-orange-400 outline-none px-2 py-2 bg-orange-50 rounded-t text-xl" placeholder="Nhập họ và tên..." />
                            </div>
                            <div className="w-48">
                                <label className="font-bold text-gray-700 block mb-2">Lớp:</label>
                                <input type="text" className="w-full border-b-2 border-gray-300 focus:border-orange-400 outline-none px-2 py-2 bg-orange-50 rounded-t text-xl" placeholder="Nhập lớp..." />
                            </div>
                            <div className="w-48">
                                <label className="font-bold text-gray-700 block mb-2">Nhóm:</label>
                                <input type="text" className="w-full border-b-2 border-gray-300 focus:border-orange-400 outline-none px-2 py-2 bg-orange-50 rounded-t text-xl" placeholder="Nhập nhóm..." />
                            </div>
                        </div>
                    </div>

                    {/* PHẦN I - PHẢN XẠ ÂM (MÀU XANH DƯƠNG PASTEL) */}
                    <div className="mb-12 bg-[#f0f7ff] rounded-2xl overflow-hidden border-2 border-[#dbeafe] shadow-md print-bg">
                        <div className="bg-[#bfdbfe] text-[#1e3a8a] px-6 py-4 border-b-2 border-[#93c5fd]">
                            <h3 className="text-2xl font-black">I – PHẢN XẠ ÂM</h3>
                        </div>
                        <div className="p-6 md:p-8 space-y-8">
                            <p className="italic text-gray-600 text-xl mb-4">Đọc thông tin mục I (SGK trang 68), quan sát Hình 14.1 và hoàn thành các nhiệm vụ.</p>
                            
                            {/* Câu 1 */}
                            <div>
                                <label className="font-bold text-[#1e40af] block mb-3">1. Khi đứng trước vách hang động và nói to, vì sao ta có thể nghe thấy tiếng nói của mình vọng lại?</label>
                                <textarea name="i_1" value={formData.i_1 || ''} onChange={handleChange} onClick={() => handleSuggest('i_1', 'Vì âm thanh từ miệng phát ra truyền đến vách đá (mặt chắn) và bị phản xạ ngược trở lại tai ta, tạo thành tiếng vọng.')} rows="2" className="w-full border-2 border-[#bfdbfe] rounded-xl p-4 text-lg-input focus:ring-4 focus:ring-[#93c5fd] outline-none bg-white cursor-pointer" placeholder="(Bấm vào đây để điền tự động đáp án gợi ý...)"></textarea>
                            </div>

                            {/* Câu 2 */}
                            <div className="bg-white p-6 rounded-xl border-2 border-[#dbeafe] shadow-sm">
                                <label className="font-bold text-[#1e40af] block mb-4">2. Âm phản xạ là gì? Hoàn thành phần điền khuyết dưới đây:</label>
                                <div className="text-2xl leading-loose text-gray-800 flex flex-wrap items-center gap-3">
                                    Âm dội lại khi gặp một
                                    <select className="border-2 border-[#93c5fd] bg-[#eff6ff] rounded-lg p-2 font-bold text-[#1e40af] outline-none cursor-pointer text-xl hover:bg-[#dbeafe] transition">
                                        <option value="">-- Chọn gợi ý --</option>
                                        <option value="mat_chan">mặt chắn</option>
                                        <option value="moi_truong">môi trường truyền âm</option>
                                        <option value="nguon_am">nguồn âm</option>
                                    </select>
                                    được gọi là
                                    <select className="border-2 border-[#93c5fd] bg-[#eff6ff] rounded-lg p-2 font-bold text-[#1e40af] outline-none cursor-pointer text-xl hover:bg-[#dbeafe] transition">
                                        <option value="">-- Chọn gợi ý --</option>
                                        <option value="tieng_on">tiếng ồn</option>
                                        <option value="am_phan_xa">âm phản xạ</option>
                                        <option value="am_thanh">âm thanh</option>
                                    </select>.
                                </div>
                            </div>

                            {/* Câu 3 */}
                            <div>
                                <label className="font-bold text-[#1e40af] block mb-3">3. Nêu một ví dụ khác về hiện tượng phản xạ âm trong đời sống.</label>
                                <textarea name="i_3" value={formData.i_3 || ''} onChange={handleChange} onClick={() => handleSuggest('i_3', 'Nói to trong một căn phòng trống và rộng, hoặc hét lớn dưới gầm cầu sẽ nghe thấy tiếng vọng lại của chính mình.')} rows="2" className="w-full border-2 border-[#bfdbfe] rounded-xl p-4 text-lg-input focus:ring-4 focus:ring-[#93c5fd] outline-none bg-white cursor-pointer" placeholder="(Bấm vào đây để điền tự động đáp án gợi ý...)"></textarea>
                            </div>

                            {/* Câu 4 */}
                            <div>
                                <label className="font-bold text-[#1e40af] block mb-3">4. Quan sát Hình 14.2 – tàu sử dụng sóng siêu âm để xác định độ sâu biển:</label>
                                <div className="pl-6 border-l-4 border-[#93c5fd] space-y-6">
                                    <div>
                                        <span className="font-bold text-gray-700 block mb-2">a) Vì sao thiết bị trên tàu có thể xác định độ sâu của biển nhờ sóng siêu âm?</span>
                                        <textarea name="i_4a" value={formData.i_4a || ''} onChange={handleChange} onClick={() => handleSuggest('i_4a', 'Tàu phát ra sóng siêu âm truyền xuống nước, khi chạm đến đáy biển (mặt chắn), sóng sẽ phản xạ ngược trở lại máy thu. Đo thời gian đi và về ta có thể tính được độ sâu.')} rows="2" className="w-full border-2 border-[#bfdbfe] rounded-xl p-4 text-lg-input focus:ring-4 focus:ring-[#93c5fd] outline-none bg-white cursor-pointer" placeholder="(Bấm vào đây để điền tự động đáp án gợi ý...)"></textarea>
                                    </div>
                                    <div>
                                        <span className="font-bold text-gray-700 block mb-2">b) Nếu thời gian từ lúc phát sóng đến khi thu được sóng phản xạ là t (s), tốc độ truyền âm trong nước là v (m/s), hãy viết công thức tính độ sâu h của biển.</span>
                                        <div className="mt-4 p-4 bg-white border-2 border-[#bfdbfe] rounded-xl flex items-center gap-4 max-w-lg">
                                            <span className="font-black text-3xl italic text-[#1e40af]">h =</span>
                                            <input name="i_4b" value={formData.i_4b || ''} onChange={handleChange} onClick={() => handleSuggest('i_4b', '(v × t) / 2')} type="text" className="flex-1 border-b-2 border-[#60a5fa] outline-none px-3 py-2 text-2xl font-mono text-center bg-[#eff6ff] rounded-t-lg text-blue-900 cursor-pointer" placeholder="(Bấm để điền công thức...)" />
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* PHẦN II - VẬT PHẢN XẠ ÂM TỐT KÉM (MÀU XANH LÁ PASTEL) */}
                    <div className="mb-12 bg-[#ecfdf5] rounded-2xl overflow-hidden border-2 border-[#a7f3d0] shadow-md print-bg">
                        <div className="bg-[#a7f3d0] text-[#065f46] px-6 py-4 border-b-2 border-[#6ee7b7]">
                            <h3 className="text-2xl font-black">II – VẬT PHẢN XẠ ÂM TỐT, VẬT PHẢN XẠ ÂM KÉM</h3>
                        </div>
                        <div className="p-6 md:p-8 space-y-8">
                            
                            {/* Câu 1 */}
                            <div>
                                <label className="font-bold text-[#047857] block mb-3">1. Thí nghiệm (SGK trang 69, Hình 14.3). Quan sát bố trí, thực hiện theo hướng dẫn của giáo viên và ghi kết quả.</label>
                                <p className="text-xl text-gray-700 mb-5 ml-4 border-l-4 border-[#6ee7b7] pl-4 py-2 bg-[#d1fae5] rounded-r-lg">
                                    <strong>Tiến hành:</strong> Lần lượt đặt tấm gỗ nhẵn, tấm xốp mềm và tấm gỗ sần sùi tại cùng một vị trí; giữ nguyên nguồn âm và vị trí nghe, so sánh âm nghe được.
                                </p>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse bg-white rounded-xl overflow-hidden shadow-sm border-2 border-[#a7f3d0]">
                                        <thead>
                                            <tr className="bg-[#d1fae5] text-[#065f46] border-b-2 border-[#6ee7b7]">
                                                <th className="p-4 font-bold w-1/3">Vật liệu đặt vào vị trí phản xạ</th>
                                                <th className="p-4 font-bold w-1/3">Mức độ âm phản xạ nghe được</th>
                                                <th className="p-4 font-bold w-1/3">Nhận xét</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-xl">
                                            <tr className="border-b-2 border-[#a7f3d0]">
                                                <td className="p-4 font-bold text-gray-800">Tấm gỗ nhẵn</td>
                                                <td className="p-4">
                                                    <select className="w-full border-2 border-[#6ee7b7] rounded-lg p-3 outline-none bg-[#ecfdf5] font-bold text-[#047857] cursor-pointer hover:bg-[#d1fae5]">
                                                        <option value="">-- Chọn --</option>
                                                        <option>Mạnh (Nghe rõ)</option>
                                                        <option>Yếu (Nghe không rõ)</option>
                                                    </select>
                                                </td>
                                                <td className="p-4">
                                                    <select className="w-full border-2 border-[#6ee7b7] rounded-lg p-3 outline-none bg-[#ecfdf5] font-bold text-[#047857] cursor-pointer hover:bg-[#d1fae5]">
                                                        <option value="">-- Chọn --</option>
                                                        <option>Phản xạ âm tốt</option>
                                                        <option>Phản xạ âm kém</option>
                                                    </select>
                                                </td>
                                            </tr>
                                            <tr className="border-b-2 border-[#a7f3d0] bg-[#f0fdf4]">
                                                <td className="p-4 font-bold text-gray-800">Tấm xốp mềm</td>
                                                <td className="p-4">
                                                    <select className="w-full border-2 border-[#6ee7b7] rounded-lg p-3 outline-none bg-[#ecfdf5] font-bold text-[#047857] cursor-pointer hover:bg-[#d1fae5]">
                                                        <option value="">-- Chọn --</option>
                                                        <option>Mạnh (Nghe rõ)</option>
                                                        <option>Yếu (Nghe không rõ)</option>
                                                    </select>
                                                </td>
                                                <td className="p-4">
                                                    <select className="w-full border-2 border-[#6ee7b7] rounded-lg p-3 outline-none bg-[#ecfdf5] font-bold text-[#047857] cursor-pointer hover:bg-[#d1fae5]">
                                                        <option value="">-- Chọn --</option>
                                                        <option>Phản xạ âm tốt</option>
                                                        <option>Phản xạ âm kém</option>
                                                    </select>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td className="p-4 font-bold text-gray-800">Tấm gỗ sần sùi</td>
                                                <td className="p-4">
                                                    <select className="w-full border-2 border-[#6ee7b7] rounded-lg p-3 outline-none bg-[#ecfdf5] font-bold text-[#047857] cursor-pointer hover:bg-[#d1fae5]">
                                                        <option value="">-- Chọn --</option>
                                                        <option>Mạnh (Nghe rõ)</option>
                                                        <option>Yếu (Nghe không rõ)</option>
                                                    </select>
                                                </td>
                                                <td className="p-4">
                                                    <select className="w-full border-2 border-[#6ee7b7] rounded-lg p-3 outline-none bg-[#ecfdf5] font-bold text-[#047857] cursor-pointer hover:bg-[#d1fae5]">
                                                        <option value="">-- Chọn --</option>
                                                        <option>Phản xạ âm tốt</option>
                                                        <option>Phản xạ âm kém</option>
                                                    </select>
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Câu 2 */}
                            <div>
                                <label className="font-bold text-[#047857] block mb-3">2. Từ thí nghiệm, bề mặt của vật phản xạ âm tốt có đặc điểm gì? Vật phản xạ âm kém có đặc điểm gì?</label>
                                <textarea name="ii_2" value={formData.ii_2 || ''} onChange={handleChange} onClick={() => handleSuggest('ii_2', 'Vật phản xạ âm tốt thường là những vật cứng, có bề mặt nhẵn.\nVật phản xạ âm kém thường là những vật mềm, xốp, có bề mặt gồ ghề.')} rows="3" className="w-full border-2 border-[#a7f3d0] rounded-xl p-4 text-lg-input focus:ring-4 focus:ring-[#6ee7b7] outline-none bg-white cursor-pointer" placeholder="(Bấm vào đây để điền tự động đáp án gợi ý...)"></textarea>
                            </div>

                            {/* Câu 3 */}
                            <div className="bg-white p-6 rounded-xl border-2 border-[#a7f3d0] shadow-sm">
                                <label className="font-bold text-[#047857] block mb-4">3. Phân loại các vật sau vào hai nhóm:</label>
                                <div className="bg-[#ecfdf5] p-4 rounded-xl border-2 border-[#a7f3d0] mb-6">
                                    <p className="text-[#047857] font-black text-2xl text-center leading-relaxed">
                                        [ghế đệm mút] &nbsp;•&nbsp; [mặt gương] &nbsp;•&nbsp; [tấm xốp] &nbsp;•&nbsp; [rèm nhung] &nbsp;•&nbsp; [mặt đá hoa] &nbsp;•&nbsp; [mặt tường gạch] &nbsp;•&nbsp; [tấm kim loại] &nbsp;•&nbsp; [tấm bìa] &nbsp;•&nbsp; [mặt nước]
                                    </p>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div className="border-4 border-[#a7f3d0] rounded-2xl p-5 bg-[#f0fdf4]">
                                        <h4 className="font-black text-2xl text-center text-[#065f46] mb-4 border-b-2 border-[#a7f3d0] pb-3 uppercase">Vật phản xạ âm tốt</h4>
                                        <textarea name="ii_3_tot" value={formData.ii_3_tot || ''} onChange={handleChange} onClick={() => handleSuggest('ii_3_tot', '- mặt gương\n- mặt đá hoa\n- mặt tường gạch\n- tấm kim loại\n- mặt nước')} rows="6" className="w-full bg-transparent outline-none resize-none text-xl font-medium cursor-pointer" placeholder="(Bấm vào đây để điền tự động đáp án...)"></textarea>
                                    </div>
                                    <div className="border-4 border-[#a7f3d0] rounded-2xl p-5 bg-[#f0fdf4]">
                                        <h4 className="font-black text-2xl text-center text-[#065f46] mb-4 border-b-2 border-[#a7f3d0] pb-3 uppercase">Vật phản xạ âm kém</h4>
                                        <textarea name="ii_3_kem" value={formData.ii_3_kem || ''} onChange={handleChange} onClick={() => handleSuggest('ii_3_kem', '- ghế đệm mút\n- tấm xốp\n- rèm nhung\n- tấm bìa')} rows="6" className="w-full bg-transparent outline-none resize-none text-xl font-medium cursor-pointer" placeholder="(Bấm vào đây để điền tự động đáp án...)"></textarea>
                                    </div>
                                </div>
                            </div>

                            {/* Câu 4 */}
                            <div>
                                <label className="font-bold text-[#047857] block mb-3">4. Trả lời câu hỏi mở đầu: Vì sao tường phòng hòa nhạc thường có bề mặt sần hoặc được treo rèm?</label>
                                <textarea name="ii_4" value={formData.ii_4 || ''} onChange={handleChange} onClick={() => handleSuggest('ii_4', 'Vì bề mặt sần sùi và rèm nhung là những vật phản xạ âm kém (hấp thụ âm tốt), giúp làm giảm hoặc làm mất tiếng vang, nhờ đó âm thanh trong phòng nghe được rõ ràng và hay hơn.')} rows="3" className="w-full border-2 border-[#a7f3d0] rounded-xl p-4 text-lg-input focus:ring-4 focus:ring-[#6ee7b7] outline-none bg-white cursor-pointer" placeholder="(Bấm vào đây để điền tự động đáp án gợi ý...)"></textarea>
                            </div>

                        </div>
                    </div>

                    {/* PHẦN III - CHỐNG Ô NHIỄM TIẾNG ỒN (MÀU CAM PASTEL) */}
                    <div className="mb-10 bg-[#fff7ed] rounded-2xl overflow-hidden border-2 border-[#fed7aa] shadow-md print-bg">
                        <div className="bg-[#fed7aa] text-[#9a3412] px-6 py-4 border-b-2 border-[#fdba74]">
                            <h3 className="text-2xl font-black">III – CHỐNG Ô NHIỄM TIẾNG ỒN</h3>
                        </div>
                        <div className="p-6 md:p-8 space-y-10">
                            
                            {/* Mục 1: Tiếng ồn */}
                            <div>
                                <h4 className="font-black text-2xl text-[#c2410c] mb-6 pb-2 border-b-2 border-[#fed7aa] uppercase">1. Tiếng ồn</h4>
                                
                                <div className="space-y-8">
                                    <div>
                                        <label className="font-bold text-[#9a3412] block mb-3">a) Theo em, khi nào âm thanh trở thành tiếng ồn? Thế nào là ô nhiễm tiếng ồn?</label>

                                    </div>

                                    <div className="bg-white p-6 rounded-xl border-2 border-[#fed7aa] shadow-sm">

                                                                <option value="">- Chọn -</option>
                                                                <option value="A">A</option>
                                                                <option value="B">B</option>

                                                                <option value="">- Chọn -</option>
                                                                <option value="A">A</option>
                                                                <option value="B">B</option>
                                                                <option value="C">C</option>
                                                            </select>
                                                        </td>
                                                    </tr>
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    <div>
                                        <label className="font-bold text-[#9a3412] block mb-3">c) Gia đình em sống gần khu chợ hoặc đường xe đông đúc. Hãy đề xuất ít nhất ba việc làm để hạn chế tiếng ồn ảnh hưởng đến sức khỏe.</label>
                                        <textarea name="iii_2c" value={formData.iii_2c || ''} onChange={handleChange} onClick={() => handleSuggest('iii_2c', '1. Đóng kín các cửa sổ, cửa ra vào khi không cần thiết.\n2. Sử dụng rèm vải dày treo ở cửa sổ để hấp thụ bớt âm.\n3. Trồng nhiều cây xanh quanh nhà để phân tán tiếng ồn.')} rows="4" className="w-full border-2 border-[#fed7aa] rounded-xl p-4 text-lg-input focus:ring-4 focus:ring-[#fdba74] outline-none bg-white cursor-pointer" placeholder="(Bấm vào đây để điền tự động đáp án gợi ý...)"></textarea>

                    <div className="text-center text-gray-500 text-lg mt-10 pb-6 border-t-2 border-gray-200 pt-6">

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
